[project]
name = "easy-pil"
version = "0.4.0"
description = "A Python library built on top of PIL to easily edit/modify images"
readme = { file = "README.md", content-type = "text/markdown" }
keywords = ["easy-pil", "easy pillow", "Pillow", "image editing"]
authors = [
    { name = "Md Shahriyar Alam", email = "mdshahriyaralam552@gmail.com" },
]
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.13.5",
    "pillow>=12.2.0",
    "requests>=2.33.1",
    "typing-extensions>=4.15.0",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
]

[project.urls]
GitHub = "https://github.com/shahriyardx/easy-pil"
Documentation = "https://easy-pil.readthedocs.io/en/latest/"
Issues = "https://github.com/shahriyardx/easy-pil/issues"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.11.0",
]
docs = [
    "sphinx>=8.2.0",
    "furo>=2025.12.19",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["easy_pil"]

[tool.ruff.lint]
ignore = ["E501", "D203", "D212", "ERA001"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"easy_pil/*" = ["ANN401"]
